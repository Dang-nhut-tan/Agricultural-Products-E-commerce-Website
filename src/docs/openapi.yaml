      tags: [Users]
      summary: Lấy người dùng theo ID
      description: Yêu cầu tài khoản admin.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết người dùng }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Users]
      summary: Cập nhật người dùng
      description: Yêu cầu tài khoản admin.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200": { description: Cập nhật người dùng thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Users]
      summary: Xóa người dùng
      description: Yêu cầu tài khoản admin.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Xóa người dùng thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/orders:
    get:
      tags: [My Orders]
      summary: Lịch sử mua hàng của người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Danh sách đơn hàng, sản phẩm, thanh toán và vận chuyển }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/orders/{id}:
    get:
      tags: [My Orders]
      summary: Chi tiết đơn hàng của người dùng hiện tại
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết đơn hàng và lịch sử trạng thái }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orders/{id}/cancel:
    patch:
      tags: [My Orders]
      summary: Hủy đơn hàng
      description: Chỉ chủ đơn được hủy khi đơn còn ở trạng thái cho phép; hệ thống tự hoàn tồn kho.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, example: Khách hàng thay đổi nhu cầu }
      responses:
        "200": { description: Hủy đơn thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Đơn đã được xử lý và không thể hủy }

  /api/payments/paypal/config:
    get:
      tags: [Payments]
      summary: Lấy cấu hình công khai của PayPal
      responses:
        "200":
          description: Trạng thái cấu hình, Client ID và tiền tệ

  /api/payments/paypal/orders:
    post:
      tags: [Payments]
      summary: Tạo đơn hàng và giao dịch PayPal
      description: Giá và tồn kho luôn được kiểm tra lại từ database.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalOrderRequest"
      responses:
        "201": { description: Tạo PayPal Order thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Sản phẩm không đủ tồn kho }
        "503": { description: PayPal chưa được cấu hình }

  /api/payments/paypal/orders/{id}/capture:
    post:
      tags: [Payments]
      summary: Xác nhận thanh toán PayPal
      description: Đối chiếu số tiền, xuất kho và cập nhật trạng thái đơn hàng. Xử lý idempotent.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: PayPal Order ID
          schema: { type: string, example: 5O190127TN364715T }
      responses:
        "200": { description: Thanh toán thành công hoặc giao dịch đã được xử lý }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Không tìm thấy giao dịch PayPal }
        "409": { description: PayPal chưa xác nhận đủ số tiền }
        "502": { description: PayPal từ chối giao dịch }

  /api/admin/statuses:
    get:
      tags: [Admin Orders]
      summary: Danh sách trạng thái đơn hàng và vận chuyển
      security:
        - adminBasicAuth: []
      responses:
        "200": { description: Danh sách mã và tên trạng thái }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/orders:
    get:
      tags: [Admin Orders]
      summary: Danh sách toàn bộ đơn hàng
      security:
        - adminBasicAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái đơn hàng
          schema: { $ref: "#/components/schemas/AdminOrderStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Danh sách đơn hàng và phân trang }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/orders/{id}:
    get:
      tags: [Admin Orders]
      summary: Chi tiết một đơn hàng
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Đơn hàng, sản phẩm, thanh toán, vận chuyển và lịch sử }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/orders/{id}/status:
    patch:
      tags: [Admin Orders]
      summary: Cập nhật trạng thái đơn hàng
      description: Tự động ghi lịch sử, đồng bộ vận chuyển và hoàn tồn kho khi hủy.
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/AdminOrderStatus" }
                reason: { type: string, maxLength: 500, example: Đã bàn giao cho đơn vị vận chuyển }
      responses:
        "200": { description: Cập nhật trạng thái thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/shipments:
    get:
      tags: [Admin Orders]
      summary: Danh sách vận chuyển
      security:
        - adminBasicAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái vận chuyển
          schema: { $ref: "#/components/schemas/AdminShipmentStatus" }
      responses:
        "200": { description: Danh sách vận chuyển kèm đơn hàng }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/shipments/{id}:
    patch:
      tags: [Admin Orders]
      summary: Cập nhật thông tin và trạng thái vận chuyển
      description: Đồng bộ trạng thái đơn hàng khi bắt đầu giao hoặc giao thành công.
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminShipmentUpdateRequest" }
      responses:
        "200": { description: Cập nhật vận chuyển thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nong-san.sid
      description: Cookie được server tạo sau khi gọi POST /api/auth/login.
    adminBasicAuth:
      type: http
      scheme: basic
      description: Dùng ADMIN_EMAIL và ADMIN_PASSWORD trong file .env.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
    CategoryQuery:
      name: category
      in: query
      description: ID danh mục
      schema: { type: integer, minimum: 1 }
    Search:
      name: search
      in: query
      schema: { type: string, example: gạo }

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
    Unauthorized:
      description: Chưa đăng nhập hoặc session không hợp lệ
    Forbidden:
      description: Không có quyền thực hiện thao tác
    NotFound:
      description: Không tìm thấy dữ liệu
    ServerError:
      description: Lỗi máy chủ

  schemas:
    PayPalOrderRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: integer
          minimum: 1
          example: 5
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id:
                type: integer
                minimum: 1
                description: ID sản phẩm
                example: 10
              quantity:
                type: integer
                minimum: 1
                maximum: 99
                example: 2

    AdminOrderStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0: Đã nhận đơn; 1: Đang chuẩn bị đơn; 2: Đã giao cho đơn vị vận chuyển; 3: Đang giao; 4: Đã hoàn thành; 5: Đã hủy"
      example: 2

    AdminShipmentStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0: Đang chuẩn bị đơn; 1: Đã giao cho đơn vị vận chuyển; 2: Đang giao; 3: Đã giao; 4: Giao thất bại; 5: Hoàn hàng"
      example: 2

    AdminShipmentUpdateRequest:
      type: object
      minProperties: 1
      properties:
        shipping_status:
          $ref: "#/components/schemas/AdminShipmentStatus"
        shipping_fee:
          type: number
          minimum: 0
          example: 30000
        tracking_code:
          type: string
          nullable: true
          example: VD-000005
        delivery_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-27T08:30:00Z"
        receiver_name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: "0901234567" }
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, nullable: true, example: Phường Bến Thành }
        district: { type: string, nullable: true, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }

    RegisterRequest:
      type: object
      required: [name, email, password, passwordConfirmation, phone, address, province]
      properties:
        name: { type: string, example: Nguyễn Văn A }
        email: { type: string, format: email, example: nguyenvana@gmail.com }
        password: { type: string, format: password, minLength: 6, example: "123456" }
        passwordConfirmation: { type: string, format: password, minLength: 6, example: "123456" }
        phone: { type: string, example: "0901234567" }
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, example: Phường Bến Thành }
        district: { type: string, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: nguyenvana@gmail.com }
        password: { type: string, format: password, example: "123456" }

    ProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: "0901234567" }
        avatarData:
          type: string
          description: Data URL ảnh JPG, PNG hoặc WebP dạng base64.
          example: data:image/png;base64,iVBORw0KGgo...

    AddressRequest:
      type: object
      required: [receiver_name, address, province]
      properties:
        receiver_name: { type: string, example: Nguyễn Văn A }
        phone:
          type: string
          description: Có thể bỏ trống nếu tài khoản đã có số điện thoại.
          example: "0901234567"
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, example: Phường Bến Thành }
        district: { type: string, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }
        is_default: { type: boolean, default: false }

    FeedbackCreateRequest:
      type: object
      required: [star, content]
      properties:
        star: { type: integer, minimum: 1, maximum: 5, example: 5 }
        content: { type: string, minLength: 2, maxLength: 1000, example: Sản phẩm rất tốt }

    FeedbackUpdateRequest:
      type: object
      minProperties: 1
      properties:
        star: { type: integer, minimum: 1, maximum: 5, example: 4 }
        content: { type: string, minLength: 2, maxLength: 1000, example: Sản phẩm tốt }

    NamedImageCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Trái cây }
        image: { type: string, example: https://example.com/image.jpg }

    NamedImageUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, example: Rau củ sạch }
        image: { type: string, example: https://example.com/image.jpg }

    BannerRequest:
      type: object
      properties:
        name: { type: string, example: Khuyến mãi mùa hè }
        image: { type: string, example: https://example.com/banner.jpg }
        status: { type: integer, example: 1 }
        sort_order: { type: integer, example: 1 }

    NewsCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Bí quyết chọn nông sản sạch }
        image: { type: string, example: https://example.com/news.jpg }
        content: { type: string, example: Nội dung bài viết }

    NewsUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, example: Bí quyết chọn rau củ sạch }
        image: { type: string, example: https://example.com/news.jpg }
        content: { type: string, example: Nội dung bài viết đã cập nhật }

    CouponCreateRequest:
      type: object
      required: [code, discount_type]
      properties:
        code: { type: string, example: SALE10 }
        discount_type:
          type: integer
          description: "1: phần trăm, 2: số tiền cố định"
          example: 1
        discount_value: { type: number, minimum: 0, example: 10 }
        min_order_value: { type: number, minimum: 0, example: 100000 }
        start_date: { type: string, format: date-time, example: "2026-07-22T00:00:00Z" }
        end_date: { type: string, format: date-time, example: "2026-08-22T23:59:59Z" }
        quantity: { type: integer, minimum: 0, example: 100 }
        used_quantity: { type: integer, minimum: 0, example: 0 }
        status: { type: integer, example: 1 }

    CouponUpdateRequest:
      type: object
      minProperties: 1
      properties:
        code: { type: string, example: SALE20 }
        discount_type:
          type: integer
          description: "1: phần trăm, 2: số tiền cố định"
          example: 1
        discount_value: { type: number, minimum: 0, example: 20 }
        min_order_value: { type: number, minimum: 0, example: 100000 }
        start_date: { type: string, format: date-time, example: "2026-07-22T00:00:00Z" }
        end_date: { type: string, format: date-time, example: "2026-08-22T23:59:59Z" }
        quantity: { type: integer, minimum: 0, example: 100 }
        used_quantity: { type: integer, minimum: 0, example: 0 }
        status: { type: integer, example: 1 }

    UserCreateRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: customer@example.com }
        password: { type: string, format: password, minLength: 6, example: "123456" }
        name: { type: string, example: Nguyễn Văn A }
        role:
          type: integer
          enum: [1, 2]
          description: "1: admin, 2: customer"
          example: 2
        status:
          type: integer
          enum: [0, 1, 2]
          description: "0: inactive, 1: active, 2: banned"
          example: 1
        avatar: { type: string, example: https://example.com/avatar.jpg }
        phone: { type: string, example: "0901234567" }

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email, example: customer@example.com }
        password: { type: string, format: password, minLength: 6, example: "123456" }
        name: { type: string, example: Nguyễn Văn A }
        role: { type: integer, enum: [1, 2], example: 2 }
        status: { type: integer, enum: [0, 1, 2], example: 1 }
        avatar: { type: string, example: https://example.com/avatar.jpg }
        phone: { type: string, example: "0901234567" }
