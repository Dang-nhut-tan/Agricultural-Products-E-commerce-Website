openapi: 3.0.3

info:
  title: Web Nông Sản API
  version: 1.0.0
  description: Tài liệu API đầy đủ cho cửa hàng, tài khoản, thanh toán và quản trị Web Nông Sản.

servers:
  - url: http://127.0.0.1:3000
    description: Development server

tags:
  - name: Authentication
  - name: My Account
  - name: User Addresses
  - name: Storefront
  - name: Products
  - name: Product Comments
  - name: Categories
  - name: Brands
  - name: Banners
  - name: News
  - name: My Orders
  - name: Payments
  - name: Admin Orders
  - name: Smart Recipes
  - name: Chatbot

paths:
  /api/chat:
    post:
      tags: [Chatbot]
      summary: Trò chuyện với trợ lý Nông Sản Xanh
      description: Yêu cầu đăng nhập. Lịch sử chỉ được gửi trong request và không lưu vào database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
                history:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, model] }
                      text: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Câu trả lời từ Gemini }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Chưa đăng nhập }

  /api/recipes/suggest:
    post:
      tags: [Smart Recipes]
      summary: Gợi ý công thức và sản phẩm đang còn hàng
      description: Yêu cầu session đăng nhập. Dùng Gemini và chỉ mục FAISS cục bộ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 200, example: "Tôi muốn nấu lẩu bò" }
                filters:
                  type: object
                  properties:
                    meal: { type: string, enum: ["", sáng, trưa, tối, "ăn nhẹ"] }
                    difficulty: { type: string, enum: ["", dễ, vừa, "nâng cao"] }
                    time: { type: string, enum: ["", "15", "30", "60", "60+"] }
                    diet: { type: string, enum: ["", "không yêu cầu", chay, "ít béo", "giàu đạm"] }
      responses:
        "200": { description: Công thức, nguyên liệu thiếu và các sản phẩm phù hợp }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Chưa đăng nhập }
        "503": { description: Chưa tạo chỉ mục FAISS hoặc Gemini chưa cấu hình }

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201": { description: Đăng ký thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email đã được sử dụng }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công và tạo session cookie
          headers:
            Set-Cookie:
              schema: { type: string }
              example: nong-san.sid=abc123; Path=/; HttpOnly
        "401": { description: Email hoặc mật khẩu không đúng }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423":
          description: Tài khoản tạm khóa một giờ sau 5 lần đăng nhập sai liên tiếp
          headers:
            Retry-After:
              description: Số giây còn lại trước khi có thể đăng nhập lại
              schema: { type: integer, example: 3600 }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Đăng xuất và xóa session
      responses:
        "200": { description: Đăng xuất thành công }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/me:
    get:
      tags: [My Account]
      summary: Lấy thông tin người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Trạng thái đăng nhập và thông tin người dùng nếu có }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/profile:
    put:
      tags: [My Account]
      summary: Cập nhật hồ sơ người dùng hiện tại
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200": { description: Cập nhật hồ sơ thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/addresses:
    get:
      tags: [User Addresses]
      summary: Lấy danh sách địa chỉ của người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Danh sách địa chỉ }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [User Addresses]
      summary: Thêm địa chỉ nhận hàng
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
      responses:
        "201": { description: Thêm địa chỉ thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/addresses/{id}:
    delete:
      tags: [User Addresses]
      summary: Xóa địa chỉ của người dùng hiện tại
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Xóa địa chỉ thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/storefront:
    get:
      tags: [Storefront]
      summary: Lấy dữ liệu tổng hợp cho trang cửa hàng
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/Search"
      responses:
        "200": { description: Dữ liệu storefront }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/products:
    get:
      tags: [Products]
      summary: Lấy danh sách sản phẩm đang bán
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/Search"
      responses:
        "200": { description: Danh sách sản phẩm và thông tin phân trang }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Lấy sản phẩm theo ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết sản phẩm }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/products/{productId}/comments:
    get:
      tags: [Product Comments]
      summary: Lấy bình luận của một sản phẩm
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200": { description: Danh sách bình luận }
        "404": { description: Không tìm thấy sản phẩm }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Product Comments]
      summary: Tạo bình luận cho sản phẩm
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreateRequest"
      responses:
        "201": { description: Tạo bình luận thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Không tìm thấy sản phẩm }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/products/{productId}/comments/{feedbackId}:
    put:
      tags: [Product Comments]
      summary: Cập nhật bình luận của chính người dùng
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdateRequest"
      responses:
        "200": { description: Cập nhật bình luận thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Không tìm thấy bình luận của người dùng }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Product Comments]
      summary: Xóa bình luận của chính người dùng
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/FeedbackId"
      responses:
        "200": { description: Xóa bình luận thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Không có quyền xóa bình luận này }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/categories:
    get:
      tags: [Categories]
      summary: Lấy danh sách danh mục
      responses:
        "200": { description: Danh sách danh mục }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Lấy danh mục theo ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết danh mục }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/brands:
    get:
      tags: [Brands]
      summary: Lấy danh sách thương hiệu
      responses:
        "200": { description: Danh sách thương hiệu }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/brands/{id}:
    get:
      tags: [Brands]
      summary: Lấy thương hiệu theo ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết thương hiệu }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/banners:
    get:
      tags: [Banners]
      summary: Lấy danh sách banner
      responses:
        "200": { description: Danh sách banner }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/banners/{id}:
    get:
      tags: [Banners]
      summary: Lấy banner theo ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết banner }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/news:
    get:
      tags: [News]
      summary: Lấy danh sách tin tức
      responses:
        "200": { description: Danh sách tin tức }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/news/{id}:
    get:
      tags: [News]
      summary: Lấy tin tức theo ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết tin tức }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/orders:
    get:
      tags: [My Orders]
      summary: Lịch sử mua hàng của người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Danh sách đơn hàng, sản phẩm, thanh toán và vận chuyển }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/orders/{id}:
    get:
      tags: [My Orders]
      summary: Chi tiết đơn hàng của người dùng hiện tại
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Chi tiết đơn hàng và lịch sử trạng thái }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orders/{id}/cancel:
    patch:
      tags: [My Orders]
      summary: Hủy đơn hàng
      description: Chỉ chủ đơn được hủy khi đơn còn ở trạng thái cho phép; hệ thống tự hoàn tồn kho.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, example: Khách hàng thay đổi nhu cầu }
      responses:
        "200": { description: Hủy đơn thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Đơn đã được xử lý và không thể hủy }

  /api/payments/paypal/config:
    get:
      tags: [Payments]
      summary: Lấy cấu hình công khai của PayPal
      responses:
        "200":
          description: Trạng thái cấu hình, Client ID và tiền tệ

  /api/payments/coupons/validate:
    post:
      tags: [Payments]
      summary: Kiểm tra mã giảm giá trước khi thanh toán
      description: Kết quả chỉ dùng để xem trước; máy chủ sẽ tính lại từ giá sản phẩm khi tạo đơn.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code: { type: string, example: SALE10 }
                subtotal: { type: number, minimum: 0, example: 250000 }
      responses:
        "200": { description: Mã hợp lệ và trả về số tiền được giảm }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Mã hết hạn, hết lượt, đã dùng hoặc đơn chưa đạt giá trị tối thiểu }

  /api/payments/paypal/orders:
    post:
      tags: [Payments]
      summary: Tạo đơn hàng và giao dịch PayPal
      description: Giá và tồn kho luôn được kiểm tra lại từ database.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalOrderRequest"
      responses:
        "201": { description: Tạo PayPal Order thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Sản phẩm không đủ tồn kho }
        "503": { description: PayPal chưa được cấu hình }

  /api/payments/paypal/orders/{id}/capture:
    post:
      tags: [Payments]
      summary: Xác nhận thanh toán PayPal
      description: Đối chiếu số tiền, xuất kho và cập nhật trạng thái đơn hàng. Xử lý idempotent.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: PayPal Order ID
          schema: { type: string, example: 5O190127TN364715T }
      responses:
        "200": { description: Thanh toán thành công hoặc giao dịch đã được xử lý }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Không tìm thấy giao dịch PayPal }
        "409": { description: PayPal chưa xác nhận đủ số tiền }
        "502": { description: PayPal từ chối giao dịch }

  /api/admin/statuses:
    get:
      tags: [Admin Orders]
      summary: Danh sách trạng thái đơn hàng và vận chuyển
      security:
        - adminBasicAuth: []
      responses:
        "200": { description: Danh sách mã và tên trạng thái }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/orders:
    get:
      tags: [Admin Orders]
      summary: Danh sách toàn bộ đơn hàng
      security:
        - adminBasicAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái đơn hàng
          schema: { $ref: "#/components/schemas/AdminOrderStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Danh sách đơn hàng và phân trang }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/orders/{id}:
    get:
      tags: [Admin Orders]
      summary: Chi tiết một đơn hàng
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Đơn hàng, sản phẩm, thanh toán, vận chuyển và lịch sử }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/orders/{id}/status:
    patch:
      tags: [Admin Orders]
      summary: Cập nhật trạng thái đơn hàng
      description: Tự động ghi lịch sử, đồng bộ vận chuyển và hoàn tồn kho khi hủy.
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/AdminOrderStatus" }
                reason: { type: string, maxLength: 500, example: Đã bàn giao cho đơn vị vận chuyển }
      responses:
        "200": { description: Cập nhật trạng thái thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/shipments:
    get:
      tags: [Admin Orders]
      summary: Danh sách vận chuyển
      security:
        - adminBasicAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái vận chuyển
          schema: { $ref: "#/components/schemas/AdminShipmentStatus" }
      responses:
        "200": { description: Danh sách vận chuyển kèm đơn hàng }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/shipments/{id}:
    patch:
      tags: [Admin Orders]
      summary: Cập nhật thông tin và trạng thái vận chuyển
      description: Đồng bộ trạng thái đơn hàng khi bắt đầu giao hoặc giao thành công.
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminShipmentUpdateRequest" }
      responses:
        "200": { description: Cập nhật vận chuyển thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nong-san.sid
      description: Cookie được server tạo sau khi gọi POST /api/auth/login.
    adminBasicAuth:
      type: http
      scheme: basic
      description: Dùng ADMIN_EMAIL và ADMIN_PASSWORD trong file .env.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
    CategoryQuery:
      name: category
      in: query
      description: ID danh mục
      schema: { type: integer, minimum: 1 }
    Search:
      name: search
      in: query
      schema: { type: string, example: gạo }

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
    Unauthorized:
      description: Chưa đăng nhập hoặc session không hợp lệ
    Forbidden:
      description: Không có quyền thực hiện thao tác
    NotFound:
      description: Không tìm thấy dữ liệu
    ServerError:
      description: Lỗi máy chủ

  schemas:
    PayPalOrderRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: integer
          minimum: 1
          example: 5
        couponCode:
          type: string
          description: Mã giảm giá đã áp dụng (không bắt buộc)
          example: SALE10
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id:
                type: integer
                minimum: 1
                description: ID sản phẩm
                example: 10
              quantity:
                type: integer
                minimum: 1
                maximum: 99
                example: 2

    AdminOrderStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0: Đã nhận đơn; 1: Đang chuẩn bị đơn; 2: Đã giao cho đơn vị vận chuyển; 3: Đang giao; 4: Đã hoàn thành; 5: Đã hủy"
      example: 2

    AdminShipmentStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0: Đang chuẩn bị đơn; 1: Đã giao cho đơn vị vận chuyển; 2: Đang giao; 3: Đã giao; 4: Giao thất bại; 5: Hoàn hàng"
      example: 2

    AdminShipmentUpdateRequest:
      type: object
      minProperties: 1
      properties:
        shipping_status:
          $ref: "#/components/schemas/AdminShipmentStatus"
        shipping_fee:
          type: number
          minimum: 0
          example: 30000
        tracking_code:
          type: string
          nullable: true
          example: VD-000005
        delivery_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-27T08:30:00Z"
        receiver_name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: "0901234567" }
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, nullable: true, example: Phường Bến Thành }
        district: { type: string, nullable: true, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }

    RegisterRequest:
      type: object
      required: [name, email, password, passwordConfirmation, phone, address, province]
      properties:
        name: { type: string, example: Nguyễn Văn A }
        email: { type: string, format: email, example: nguyenvana@gmail.com }
        password: { type: string, format: password, minLength: 6, example: "123456" }
        passwordConfirmation: { type: string, format: password, minLength: 6, example: "123456" }
        phone: { type: string, example: "0901234567" }
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, example: Phường Bến Thành }
        district: { type: string, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: nguyenvana@gmail.com }
        password: { type: string, format: password, example: "123456" }

    ProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: "0901234567" }
        avatarData:
          type: string
          description: Data URL ảnh JPG, PNG hoặc WebP dạng base64.
          example: data:image/png;base64,iVBORw0KGgo...

    AddressRequest:
      type: object
      required: [receiver_name, address, province]
      properties:
        receiver_name: { type: string, example: Nguyễn Văn A }
        phone:
          type: string
          description: Có thể bỏ trống nếu tài khoản đã có số điện thoại.
          example: "0901234567"
        address: { type: string, example: 123 Nguyễn Trãi }
        ward: { type: string, example: Phường Bến Thành }
        district: { type: string, example: Quận 1 }
        province: { type: string, example: TP. Hồ Chí Minh }
        is_default: { type: boolean, default: false }

    FeedbackCreateRequest:
      type: object
      required: [star, content]
      properties:
        star: { type: integer, minimum: 1, maximum: 5, example: 5 }
        content: { type: string, minLength: 2, maxLength: 1000, example: Sản phẩm rất tốt }

    FeedbackUpdateRequest:
      type: object
      minProperties: 1
      properties:
        star: { type: integer, minimum: 1, maximum: 5, example: 4 }
        content: { type: string, minLength: 2, maxLength: 1000, example: Sản phẩm tốt }

