openapi: 3.0.3

info:
  title: Web Nông Sản API
  version: 1.0.0
  description: Tài liệu API đầy đủ cho cửa hàng, tài khoản, thanh toán và quản trị Web Nông Sản.

servers:
  - url: http://127.0.0.1:3000
    description: Development server

tags:
  - name: Authentication
  - name: My Account
  - name: User Addresses
  - name: Storefront
  - name: Products
  - name: Product Comments
  - name: Categories
  - name: Brands
  - name: Banners
  - name: News
  - name: Coupons
  - name: Users
  - name: My Orders
  - name: Payments
  - name: Admin Orders

paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201": { description: Đăng ký thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email đã được sử dụng }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công và tạo session cookie
          headers:
            Set-Cookie:
              schema: { type: string }
              example: nong-san.sid=abc123; Path=/; HttpOnly
        "401": { description: Email hoặc mật khẩu không đúng }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423":
          description: Tài khoản tạm khóa một giờ sau 5 lần đăng nhập sai liên tiếp
          headers:
            Retry-After:
              description: Số giây còn lại trước khi có thể đăng nhập lại
              schema: { type: integer, example: 3600 }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Đăng xuất và xóa session
      responses:
        "200": { description: Đăng xuất thành công }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/me:
    get:
      tags: [My Account]
      summary: Lấy thông tin người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Trạng thái đăng nhập và thông tin người dùng nếu có }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/profile:
    put:
      tags: [My Account]
      summary: Cập nhật hồ sơ người dùng hiện tại
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200": { description: Cập nhật hồ sơ thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/addresses:
    get:
      tags: [User Addresses]
      summary: Lấy danh sách địa chỉ của người dùng hiện tại
      security:
        - sessionCookie: []
      responses:
        "200": { description: Danh sách địa chỉ }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [User Addresses]
      summary: Thêm địa chỉ nhận hàng
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
      responses:
        "201": { description: Thêm địa chỉ thành công }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/addresses/{id}:
    delete:
      tags: [User Addresses]
      summary: Xóa địa chỉ của người dùng hiện tại
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Xóa địa chỉ thành công }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/storefront:
    get:
      tags: [Storefront]
      summary: Lấy dữ liệu tổng hợp cho trang cửa hàng
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/Search"
      responses:
        "200": { description: Dữ liệu storefront }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/products:
