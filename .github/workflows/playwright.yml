name: Playwright and API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: 123456
      DB_DATABASE: web_nong_san
      DB_DIALECT: mysql
      HOST: 127.0.0.1
      PORT: 3000

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: web_nong_san
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Tải source code từ repository xuống runner
      - name: Checkout source code
        uses: actions/checkout@v5

      # Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Bật Corepack để sử dụng Yarn
      - name: Enable Yarn
        run: corepack enable

      # Kiểm tra phiên bản Node.js và Yarn
      - name: Check versions
        run: |
          node --version
          yarn --version

      # Cài dependencies trong package.json
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare test database
        run: |
          yarn sequelize-cli db:migrate
          yarn sequelize-cli db:seed:all

      # Cài Chromium và các thư viện cần thiết
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      # Chạy Playwright smoke test
      - name: Run one Playwright smoke test
        run: yarn playwright test tests/smoke.spec.js --project=chromium

      - name: Start backend for API tests
        run: |
          yarn start > backend.log 2>&1 &
          echo $! > backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run API tests with Newman
        run: yarn api:test

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log || true
